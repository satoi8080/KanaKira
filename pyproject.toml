[project]
name = "kanakira"
version = "0.2.1"
description = "KanaKira is a TrueType font that combines Katakana characters with their Romaji equivalents, displaying the Romaji text above each Katakana character."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.63.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.14",
    "virtualenv>=20.36.1",
]

[tool.ruff]
src = ["."]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
